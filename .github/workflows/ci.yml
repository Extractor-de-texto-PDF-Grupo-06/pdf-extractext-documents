name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Tests unitarios
        run: uv run pytest
      - name: Tests de integración contra MongoDB
        run: uv run pytest -m integration
      - name: Auditar dependencias de produccion
        run: |
          uv export --locked --no-hashes --format requirements-txt --output-file /tmp/requirements.txt
          uvx --from pip-audit pip-audit --requirement /tmp/requirements.txt --strict

  seguridad-imagen:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen para escaneo
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/pdf-extractext-documents:ci
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/pdf-extractext-documents:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Construye la imagen en cada PR y push, así un Dockerfile roto se ve antes de fusionar.
  # Solo al fusionar en main la publica en ghcr con latest y el hash del commit (T11).
  docker:
    needs: [tests, seguridad-imagen]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Iniciar sesión en ghcr
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir la imagen y publicarla si es main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ghcr.io/extractor-de-texto-pdf-grupo-06/pdf-extractext-documents:latest
            ghcr.io/extractor-de-texto-pdf-grupo-06/pdf-extractext-documents:${{ github.sha }}
