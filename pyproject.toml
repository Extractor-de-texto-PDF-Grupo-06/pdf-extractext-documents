[project]
name = "pdf-extractext-documents"
version = "0.1.0"
description = "Microservicio documents de pdf-extractext: CRUD de documentos sobre MongoDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "motor>=3.4.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false
