[pytest]
# Suite del microservicio documents.
testpaths = tests
# Permite importar app y tests sin exportar PYTHONPATH a mano.
pythonpath = .
asyncio_mode = auto
# `uv run pytest` corre solo los unitarios; `uv run pytest -m integration` pisa este filtro.
addopts = -m "not integration"
markers =
    integration: pruebas contra un MongoDB real; se saltan si no responde
